services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: duckdoku
      POSTGRES_USER: duckdoku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duckdoku"]
      interval: 5s
      retries: 5

volumes:
  db-data:
